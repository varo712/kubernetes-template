[tools]
pre-commit = "4.6.2"
sops = "3.13.3"
age = "1.3.2"
kubectl = "1.37.1"
helm = "4.3.0"

[tasks.init]
description = "Configura el entorno de desarrollo completo: hooks pre-commit, clave age para sops, plugins de helm"
depends = ["age-keygen"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

pre-commit install

helm plugin list 2>/dev/null | grep -q "^diff" || helm plugin install --verify=false https://github.com/databus23/helm-diff
helm plugin list 2>/dev/null | grep -q "^secrets" || helm plugin install --verify=false https://github.com/jkroepke/helm-secrets

echo "Entorno listo."
'''

[tasks.age-keygen]
description = "Genera par de claves age para sops en el path estandar (~/.config/sops/age/keys.txt) y actualiza .sops.yaml"
run = '''
#!/usr/bin/env bash
set -euo pipefail
keyfile="$HOME/.config/sops/age/keys.txt"
mkdir -p "$(dirname "$keyfile")"
if [ -f "$keyfile" ]; then
  echo "$keyfile ya existe, no se sobreescribe"
else
  age-keygen -o "$keyfile"
  echo "Clave generada en $keyfile"
fi

pubkey="$(grep "public key" "$keyfile" | sed 's/.*: //')"
echo "Clave publica: $pubkey"

if grep -q "REEMPLAZAME" .sops.yaml; then
  sed -i -E "s|age: .*REEMPLAZAME.*|age: $pubkey|" .sops.yaml
  echo ".sops.yaml actualizado con la public key"
else
  echo ".sops.yaml ya tiene una public key configurada, no se modifica"
fi
'''

[tasks.add-recipient]
description = "Agrega una public key age a .sops.yaml y actualiza los secrets ya encriptados (uso: mise run add-recipient -- age1...)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
newkey="$1"

if grep -q "$newkey" .sops.yaml; then
  echo "La clave ya esta en .sops.yaml, no se modifica"
else
  sed -i -E "s|^(\s*age: )(.*)|\1\2,$newkey|" .sops.yaml
  echo ".sops.yaml actualizado con la nueva public key"
fi

find . -type f \( -iname "*.secret.yaml" -o -iname "*.secret.yml" -o -iname "*.secrets.yaml" -o -iname "*.secrets.yml" \) -not -path "./.git/*" | while read -r f; do
  if grep -q "sops:" "$f" 2>/dev/null; then
    echo "actualizando recipients en: $f"
    sops updatekeys -y "$f"
  else
    echo "skip (no encriptado): $f"
  fi
done
'''

[tasks.encrypt]
description = "Encripta todos los *.secret(s).yaml/yml con sops"
run = '''
#!/usr/bin/env bash
set -euo pipefail
find . -type f \( -iname "*.secret.yaml" -o -iname "*.secret.yml" -o -iname "*.secrets.yaml" -o -iname "*.secrets.yml" \) -not -path "./.git/*" | while read -r f; do
  if grep -q "sops:" "$f" 2>/dev/null; then
    echo "skip (ya encriptado): $f"
    continue
  fi
  echo "encriptando: $f"
  sops --encrypt --in-place "$f"
done
'''

[tasks.decrypt]
description = "Desencripta todos los *.secret(s).yaml/yml con sops"
run = '''
#!/usr/bin/env bash
set -euo pipefail
find . -type f \( -iname "*.secret.yaml" -o -iname "*.secret.yml" -o -iname "*.secrets.yaml" -o -iname "*.secrets.yml" \) -not -path "./.git/*" | while read -r f; do
  echo "desencriptando: $f"
  sops --decrypt --in-place "$f"
done
'''

[tasks.edit]
description = "Edita un secret encriptado con sops (uso: mise run edit -- path/al/archivo.secret.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops "$1"
'''

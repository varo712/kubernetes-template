[env]
# Nombre unico del proyecto: separa las claves age de cluster entre proyectos
PROJECT_NAME = "REEMPLAZAME"

[tools]
pre-commit = "4.6.2"
sops = "3.13.3"
age = "1.3.2"
kubectl = "1.37.1"
helm = "4.3.0"
flux2 = "2.10.0"
flux-operator = "0.62.1"
kustomize = "5.8.3"
kubeconform = "0.8.0"

[tasks.init]
description = "Configura el entorno de desarrollo completo: hooks pre-commit, valores del proyecto, clave age para sops, plugins de helm"
depends = ["age-keygen"]
raw = true
file = "scripts/init.sh"

[tasks.age-keygen]
description = "Genera par de claves age para sops en el path estandar (~/.config/sops/age/keys.txt) y la pone como clave del equipo en .sops.yaml (nunca en prod)"
file = "scripts/age-keygen.sh"

[tasks.add-recipient]
description = "Agrega una public key age a una regla de .sops.yaml y actualiza sus secrets (uso: mise run add-recipient -- <dev|preprod|prod|local> age1...)"
file = "scripts/add-recipient.sh"

[tasks.encrypt]
description = "Encripta todos los *.secret(s).yaml/yml con sops"
file = "scripts/encrypt.sh"

[tasks.decrypt]
description = "Desencripta los *.secret(s).yaml/yml a tu alcance, avisando de los que no puede (uso: mise run decrypt [-- ruta])"
file = "scripts/decrypt.sh"

[tasks.edit]
description = "Edita un secret encriptado con sops (uso: mise run edit -- path/al/archivo.secret.yaml)"
file = "scripts/edit.sh"

[tasks.configure]
description = "Pregunta los valores del proyecto (nombre, repositorio, protocolo, rama, aprobadores) y los escribe en la plantilla"
raw = true
file = "scripts/configure.sh"

[tasks.validate]
description = "Valida los manifiestos de todos los entornos con kustomize y kubeconform"
file = "scripts/validate.sh"

[tasks.flux-keygen]
description = "Genera la clave age de un cluster y la agrega a .sops.yaml (uso: mise run flux-keygen -- <dev|preprod|prod>)"
file = "scripts/flux-keygen.sh"

[tasks.flux-bootstrap]
description = "Instala Flux Operator y Flux en un cluster (uso: GIT_TOKEN=... o GIT_SSH_KEY_FILE=... mise run flux-bootstrap -- <dev|preprod|prod> <kube-context>)"
file = "scripts/flux-bootstrap.sh"

[tasks.flux-status]
description = "Muestra el estado de Flux en un cluster (uso: mise run flux-status -- <kube-context>)"
file = "scripts/flux-status.sh"

[tasks.flux-diff]
description = "Compara los manifiestos locales de un entorno con su cluster (uso: mise run flux-diff -- <dev|preprod|prod> <kube-context>)"
file = "scripts/flux-diff.sh"
